<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Learning Research</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header>
  <h1>Deep Learning Research Portfolio</h1>
  <p class="sub">GPU Accelerated Training Demo</p>
  <div class="controls">
    <div class="control-group">
      <label for="epochInput">Epochs:</label>
      <input type="number" id="epochInput" value="10" min="1" max="50">
    </div>
    <button onclick="startTraining()">Train Model</button>
  </div>
</header>

<section class="card">
  <h2>Training Loss</h2>
  <canvas id="lossChart"></canvas>
</section>

<section class="card">
  <h2>Model Accuracy</h2>
  <canvas id="accChart"></canvas>
</section>

<section class="card">
  <h2>Model Architecture</h2>
  <img src="https://miro.medium.com/v2/resize:fit:1400/1*BHzGVskWGS_3jEcYYi6miQ.png" class="arch">
</section>

<section class="card">
  <h2>System</h2>
  <p>GPU: RTX3060</p>
  <p>Framework: PyTorch</p>
  <p>CUDA: Enabled</p>
</section>

<script src="app.js"></script>
</body>
</html>
